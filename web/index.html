<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>proc-quest map viewer</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>proc-quest map viewer</h1>
      <div class="controls">
        <label for="seed-input">Seed</label>
        <input id="seed-input" type="number" step="1" />
        <button id="regenerate-btn" type="button">Regenerate</button>
        <button id="random-btn" type="button">Random seed</button>
        <span id="seed-display"></span>
      </div>
    </header>
    <div id="banner" role="status"></div>
    <main>
      <div id="map-container"></div>
      <aside id="game-panel">
        <div id="status-panel"></div>
        <h2>Log</h2>
        <ul id="log-panel"></ul>
      </aside>
      <ul id="legend" class="legend"></ul>
    </main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
